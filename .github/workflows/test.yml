name: Build APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: -Xmx2048m -Dorg.gradle.daemon=false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 修复权限问题 - 解决 "Permission denied" 错误
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 修复 Chaquopy 插件报错 - local.properties 缺失导致的 FileNotFoundException
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 缓存 Android SDK 以加速构建
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/build-cache
            ~/.android/avd
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      # 构建 Debug APK - 详细日志用于问题诊断
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        continue-on-error: false

      # 列出所有生成的 APK，若为空则直接失败，避免误判构建成功
      - name: List generated APKs
        if: success()
        run: |
          find app/build/outputs/apk -name "*.apk" -type f
          if [ -z "$(find app/build/outputs/apk -name '*.apk' -type f)" ]; then
             echo "::error::No APK files found!"
             exit 1
          fi

      # 上传所有 Debug APK（支持多产品风味）
      - name: Upload Debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-debug-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
          if-no-files-found: warn

      # 构建失败时上传日志用于诊断
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/outputs/
            build/
          retention-days: 3
