name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: -Xmx2048m -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 修复权限问题 - 解决 "Permission denied" 错误
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 缓存 Android SDK 以加速构建
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/build-cache
            ~/.android/avd
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      # 构建 Debug APK - 详细日志用于问题诊断
      - name: Build Debug APK
        run: ./gradlew assembleDebug -v --stacktrace --no-daemon
        continue-on-error: false

      # 列出所有生成的 APK
      - name: List generated APKs
        run: find app/build/outputs/apk -name "*.apk" -type f

      # 上传所有 Debug APK（支持多产品风味）
      - name: Upload Debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-debug-apks
          path: app/build/outputs/apk/**/**.apk
          retention-days: 7

      # 构建失败时上传日志用于诊断
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/outputs/
            build/
          retention-days: 3

  # 可选：Release 构建 Job（需要签名密钥）
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch'  # 仅手动触发时构建 Release

    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/build-cache
            ~/.android/avd
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/build.gradle') }}

      - name: Build Release APK
        run: ./gradlew assembleRelease -v --stacktrace --no-daemon
        continue-on-error: false

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-release-apks
          path: app/build/outputs/apk/**/**.apk
          retention-days: 14
